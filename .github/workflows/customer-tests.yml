name: Customer billing tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  customer-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: customer_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: customer_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U customer_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HOMESTEAD_CUSTOMER_TEST_DATABASE_URL: postgresql://customer_test:fixture-only-password@localhost:5432/customer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:customer
      - run: npm test
      - run: npm run build
