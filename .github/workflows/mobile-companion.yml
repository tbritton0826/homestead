name: Check iOS companion
on:
  pull_request:
    paths: ['companion/ios/**', '.github/workflows/mobile-companion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: companion/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: xcodebuild -version
      - run: node --test Tests/*.test.cjs
      - run: swift test
      - run: xcodebuild -project Homestead.xcodeproj -scheme Homestead -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
